# docker-compose.sandbox.yml
# Example deployment of the Sysbox-isolated sandbox variant of open-terminal.
#
# Prerequisites on the HOST (see Brain-Memory infra namespace, entry
# "Sysbox Nested Docker Sandbox" for the full verified procedure):
#   1. Kernel >= 5.6 (CONFIG_TIME_NS) - tested on 5.15.0-139-generic (HWE)
#   2. Sysbox CE installed (https://github.com/nestybox/sysbox/releases)
#      and registered as a Docker runtime ("sysbox-runc")
#   3. sysbox-mgr and sysbox-fs systemd services active
#      (if sysbox-fs fails to start via systemd with a timeout, check for a
#      duplicate "Type=" directive in its unit file and override to
#      Type=simple via a drop-in - see Brain-Memory entry for details)
#
# KNOWN LIMITATION: the base image's built-in egress firewall
# (OPEN_TERMINAL_ALLOWED_DOMAINS) is intentionally left UNSET here. It
# relies on `capsh --drop=cap_net_admin` succeeding for the non-root
# "user" process via ambient capabilities from cap_add, which Sysbox does
# not replicate the same way vanilla runc does - capsh fails, crashing
# the container in a restart loop. Network egress restriction for this
# sandbox should be enforced at the host firewall / Docker network policy
# level instead until this is resolved upstream or worked around.
#
# NETWORKING: this service joins TWO networks -
#   - sandbox-egress-net: isolated bridge for the sandbox's own outbound
#     traffic (created by this compose file).
#   - agentic-internal: pre-existing EXTERNAL network shared with the main
#     Open WebUI stack, so Admin Panel -> Integrations -> Open Terminal can
#     reach this container by hostname (http://sandbox-open-terminal:8000).

services:
  sandbox-open-terminal:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: sandbox-open-terminal:latest
    container_name: sandbox-open-terminal
    runtime: sysbox-runc          # <-- key line: isolated nested Docker
    restart: unless-stopped
    # NOTE: intentionally NO bind-mount of /var/run/docker.sock from the host.
    volumes:
      - sandbox-workspace:/home/user
    environment:
      - OPEN_TERMINAL_API_KEY=${SANDBOX_TERMINAL_KEY}
      # Egress firewall intentionally DISABLED under Sysbox - see note above.
      # - OPEN_TERMINAL_ALLOWED_DOMAINS=*.pypi.org,*.npmjs.org,registry-1.docker.io,github.com,raw.githubusercontent.com
    networks:
      - sandbox-egress-net
      - agentic-internal
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G

networks:
  sandbox-egress-net:
    driver: bridge
  agentic-internal:
    external: true

volumes:
  sandbox-workspace:
