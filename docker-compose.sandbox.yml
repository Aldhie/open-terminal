# docker-compose.sandbox.yml
# Example deployment of the Sysbox-isolated sandbox variant of open-terminal.
#
# Prerequisites on the HOST (see Brain-Memory infra namespace, entry
# "Sysbox Nested Docker Sandbox" for the full verified procedure):
#   1. Kernel >= 5.6 (CONFIG_TIME_NS) - tested on 5.15.0-139-generic (HWE)
#   2. Sysbox CE installed (https://github.com/nestybox/sysbox/releases)
#      and registered as a Docker runtime ("sysbox-runc")
#   3. sysbox-mgr and sysbox-fs systemd services active
#      (if sysbox-fs fails to start via systemd with a timeout, check for a
#      duplicate "Type=" directive in its unit file and override to
#      Type=simple via a drop-in - see Brain-Memory entry for details)

services:
  sandbox-open-terminal:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: sandbox-open-terminal:latest
    container_name: sandbox-open-terminal
    runtime: sysbox-runc          # <-- key line: isolated nested Docker
    restart: unless-stopped
    # Sysbox does not grant these by default. CAP_NET_ADMIN is required by
    # entrypoint.sh's egress firewall (iptables/ipset) and CAP_SETPCAP is
    # required for the subsequent `capsh --drop=cap_net_admin` call that
    # permanently drops CAP_NET_ADMIN again once the firewall is in place.
    # Without both, capsh fails, its child dies, tini exits, and the
    # container crash-loops under restart: unless-stopped.
    cap_add:
      - NET_ADMIN
      - SETPCAP
    # NOTE: intentionally NO bind-mount of /var/run/docker.sock from the host.
    volumes:
      - sandbox-workspace:/home/user
    environment:
      - OPEN_TERMINAL_API_KEY=${SANDBOX_TERMINAL_KEY}
      # Egress firewall allow-list (built into the base image) - adjust as needed
      - OPEN_TERMINAL_ALLOWED_DOMAINS=*.pypi.org,*.npmjs.org,registry-1.docker.io,github.com,raw.githubusercontent.com
    networks:
      - sandbox-egress-net
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G

networks:
  sandbox-egress-net:
    driver: bridge

volumes:
  sandbox-workspace:
